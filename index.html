<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share your photos</title>
<meta name="theme-color" content="#1f3d2b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--green:#1f3d2b;--green2:#2f5a3f;--red:#6b1425;--gold:#c9a24a;--cream:#f7f1e4;--ink:#2e2a26}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:Lora,Georgia,"Times New Roman",serif;color:var(--cream);
    background:radial-gradient(ellipse at top,var(--green2),var(--green) 75%);background-attachment:fixed;
    -webkit-text-size-adjust:100%}
  #glow{position:fixed;inset:0;pointer-events:none;z-index:0}
  main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:20px 20px 40px;text-align:center}
  .langs{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
  .langs button{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:99px;font:600 13px system-ui;cursor:pointer}
  .langs button.on{background:var(--gold);color:var(--green)}
  .orn{display:block;margin:0 auto 4px}
  h1{font-weight:400;font-style:italic;font-size:42px;line-height:1.15;margin:6px 0 8px;color:var(--cream)}
  .date{font-size:17px;letter-spacing:4px;color:var(--gold);margin-bottom:20px}
  .card{background:var(--cream);color:var(--ink);border-radius:18px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:2px solid var(--gold)}
  .card p{margin:0 0 14px;font-size:17px;line-height:1.4}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:18px;font:700 19px system-ui;cursor:pointer;color:#fff;background:var(--red)}
  .btn:disabled{opacity:.5}
  .btn.alt{background:var(--green);margin-top:10px}
  input[type=text],textarea{width:100%;font:16px system-ui;padding:12px;border:1px solid #cdbf9c;border-radius:10px;margin-bottom:10px;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  .opt{font:13px system-ui;color:#777;text-align:left;margin:4px 2px 4px}
  #thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
  #thumbs div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#ddd}
  #thumbs img{width:100%;height:100%;object-fit:cover}
  #thumbs .st{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font:700 11px system-ui;padding:2px}
  #thumbs .done .st{background:rgba(47,90,63,.92)} #thumbs .err .st{background:rgba(107,20,37,.92)}
  .bar{height:10px;background:#e7dcc0;border-radius:99px;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
  .hide{display:none}
  .big{font-size:48px;color:var(--red);line-height:1;margin-bottom:8px}
  .small{font:13px system-ui;color:var(--gold);margin-top:18px;opacity:.9}
</style>
</head>
<body>
<canvas id="glow"></canvas>
<main>
  <div class="langs" id="langs"></div>
  <svg class="orn" viewBox="0 0 120 30" width="120" height="30" aria-hidden="true"><g fill="none" stroke="#c9a24a" stroke-width="1.2" stroke-linecap="round"><path d="M10 15h40M70 15h40"/></g><path d="M60 7l5 8-5 8-5-8z" fill="#c9a24a"/></svg>
  <h1 id="names"></h1>
  <div class="date" id="date"></div>

  <section class="card" id="form">
    <p id="t_intro"></p>
    <input id="file" type="file" accept="image/*" multiple class="hide">
    <button class="btn" id="pick"></button>
    <div id="thumbs"></div>
    <div id="extra" class="hide">
      <div class="opt" id="t_name_l"></div>
      <input type="text" id="name" maxlength="40" autocomplete="name">
      <div class="opt" id="t_msg_l"></div>
      <textarea id="note" maxlength="800"></textarea>
      <button class="btn" id="send"></button>
    </div>
    <div class="bar hide" id="bar"><i></i></div>
    <p id="status" style="margin:8px 0 0;font:15px system-ui;color:#6b1425"></p>
  </section>

  <section class="card hide" id="thanks">
    <div class="big">♥</div>
    <p id="t_thanks" style="font-size:20px"></p>
    <button class="btn alt" id="more"></button>
  </section>

  <div class="small" id="t_foot"></div>
</main>

<script>
/* ===== names/date are set; paste your Apps Script URL + secret here ===== */
const CONFIG = {
  names:  "Paulina & Ozgun",
  date:   "2026-12-18",                  // YYYY-MM-DD
  scriptUrl: "https://script.google.com/macros/s/AKfycbwvKFa6234hUEbln3dnhi9SHpuYxP9ScJESZlm7jTulUKm2wX_3m_FXYFu-kRCHIX5nAw/exec",
  secret: "pauli-ozgun-18122026-k7q3", // must match SECRET in Code.gs
  maxSide: 2560,                         // photos are resized to this (px) before upload
  quality: 0.85
};
/* =================================================== */

const T = {
  pl:{name:"Polski",intro:"Pomóż nam zachować wspomnienia z naszego wielkiego dnia! Dodaj tutaj swoje zdjęcia, trafią prosto do naszego albumu.",
    pick:"📷 Wybierz zdjęcia",name_l:"Twoje imię (opcjonalnie)",msg_l:"Życzenia dla Pary Młodej (opcjonalnie)",
    send:"Wyślij do albumu",sending:"Wysyłanie",of:"z",thanks:"Dziękujemy! Twoje zdjęcia są w naszym albumie.",
    more:"Dodaj więcej zdjęć",err:"Nie udało się wysłać niektórych zdjęć. Dotknij „Wyślij”, aby spróbować ponownie.",ph_name:"np. Ciocia Maria",ph_msg:"Napisz coś miłego…",
    sel:"wybrano",foot:"Dziękujemy, że jesteście z nami",fmt:"pl-PL"},
  tr:{name:"Türkçe",intro:"Büyük günümüzün anılarını saklamamıza yardım edin! Fotoğraflarınızı buradan ekleyin, doğrudan albümümüze gelsin.",
    pick:"📷 Fotoğraf seç",name_l:"Adınız (isteğe bağlı)",msg_l:"Çifte bir mesaj (isteğe bağlı)",
    send:"Albüme gönder",sending:"Gönderiliyor",of:"/",thanks:"Teşekkürler! Fotoğraflarınız albümümüzde.",
    more:"Daha fazla fotoğraf ekle",err:"Bazı fotoğraflar gönderilemedi. Tekrar denemek için “Albüme gönder”e dokunun.",ph_name:"örn. Ayşe Teyze",ph_msg:"Güzel bir şeyler yazın…",
    sel:"seçildi",foot:"Bizimle olduğunuz için teşekkürler",fmt:"tr-TR"},
  en:{name:"English",intro:"Help us keep the memories of our big day! Add your photos here and they go straight to our album.",
    pick:"📷 Choose photos",name_l:"Your name (optional)",msg_l:"A message for the couple (optional)",
    send:"Send to the album",sending:"Sending",of:"of",thanks:"Thank you! Your photos are in our album.",
    more:"Add more photos",err:"Some photos failed. Tap send to retry.",ph_name:"e.g. Aunt Maria",ph_msg:"Write something sweet…",
    sel:"selected",foot:"Thank you for celebrating with us",fmt:"en-GB"}
};
const $ = id => document.getElementById(id);
let lang = localStorage.getItem("lang");
if(!T[lang]){ const n=(navigator.language||"en").slice(0,2); lang=T[n]?n:"en"; }
let files=[]; // {file, state}

function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.title=CONFIG.names;
  $("names").textContent=CONFIG.names;
  const d=new Date(CONFIG.date+"T12:00:00");
  $("date").textContent=isNaN(d)?CONFIG.date:d.toLocaleDateString(t.fmt,{day:"numeric",month:"long",year:"numeric"});
  $("t_intro").textContent=t.intro; $("pick").textContent=t.pick;
  $("t_name_l").textContent=t.name_l; $("t_msg_l").textContent=t.msg_l;
  $("name").placeholder=t.ph_name; $("note").placeholder=t.ph_msg;
  $("send").textContent=t.send; $("t_thanks").textContent=t.thanks; $("more").textContent=t.more;
  $("t_foot").textContent=t.foot;
  $("langs").innerHTML="";
  for(const k in T){const b=document.createElement("button");b.textContent=T[k].name;b.className=k===lang?"on":"";
    b.onclick=()=>{lang=k;try{localStorage.setItem("lang",k)}catch(e){}render()};$("langs").appendChild(b);}
}
render();

$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{
  for(const f of e.target.files) files.push({file:f,state:"new"});
  e.target.value=""; drawThumbs();
};
function drawThumbs(){
  $("thumbs").innerHTML="";
  files.forEach(o=>{
    const d=document.createElement("div"); d.className=o.state==="done"?"done":o.state==="err"?"err":"";
    if(!o.url) o.url=URL.createObjectURL(o.file);
    d.innerHTML='<img src="'+o.url+'"><div class="st">'+(o.state==="done"?"✓":o.state==="err"?"!":"")+'</div>';
    $("thumbs").appendChild(d);
  });
  $("extra").classList.toggle("hide",!files.length);
  $("pick").textContent=files.length?"➕ "+files.length+" "+T[lang].sel:T[lang].pick;
  if(files.length)$("pick").className="btn alt"; else $("pick").className="btn";
}

function toJpeg(file){
  return new Promise(res=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      let {width:w,height:h}=img, s=Math.min(1,CONFIG.maxSide/Math.max(w,h));
      const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{URL.revokeObjectURL(u);res(b?{blob:b,mime:"image/jpeg"}:{blob:file,mime:file.type})},"image/jpeg",CONFIG.quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res({blob:file,mime:file.type||"image/jpeg"})};
    img.src=u;
  });
}
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}

async function post(payload){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(CONFIG.scriptUrl,{method:"POST",body:JSON.stringify(payload)}); // text/plain => no CORS preflight
      const j=await r.json(); if(j.ok) return true;
    }catch(e){}
    await new Promise(r=>setTimeout(r,1200*(i+1)));
  }
  return false;
}

$("send").onclick=async()=>{
  const t=T[lang], name=$("name").value.trim(), note=$("note").value.trim();
  const todo=files.filter(o=>o.state!=="done"); if(!todo.length) return;
  $("send").disabled=true; $("pick").disabled=true; $("bar").classList.remove("hide");
  let n=0, failed=0, noteSent=false;
  for(const o of todo){
    $("status").textContent=t.sending+" "+(n+1)+" "+t.of+" "+todo.length+"…";
    const {blob,mime}=await toJpeg(o.file);
    const ok=await post({secret:CONFIG.secret,name,note:noteSent?"":note,mime,file:await b64(blob)});
    if(ok){o.state="done";noteSent=true}else{o.state="err";failed++}
    n++; $("bar").firstElementChild.style.width=(n/todo.length*100)+"%"; drawThumbs();
  }
  $("send").disabled=false; $("pick").disabled=false; $("bar").classList.add("hide");
  if(failed){ $("status").textContent=t.err; return; }
  $("status").textContent=""; files=[]; $("note").value=""; drawThumbs();
  $("form").classList.add("hide"); $("thanks").classList.remove("hide");
};
$("more").onclick=()=>{$("thanks").classList.add("hide");$("form").classList.remove("hide");$("bar").firstElementChild.style.width="0"};

/* soft golden lights */
(function(){
  const c=$("glow"),x=c.getContext("2d");let W,H,f=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight}
  size();addEventListener("resize",size);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let i=0;i<28;i++)f.push({x:Math.random()*W,y:Math.random()*H,r:1.5+Math.random()*3.5,s:.15+Math.random()*.35,p:Math.random()*6});
  (function loop(t){
    x.clearRect(0,0,W,H);
    f.forEach(p=>{p.y-=p.s;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
      const a=.25+.25*Math.sin(t/900+p.p), g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,"rgba(230,198,109,"+a+")");g.addColorStop(1,"rgba(230,198,109,0)");
      x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*4,0,7);x.fill()});
    requestAnimationFrame(loop);
  })(0);
})();
</script>
</body>
</html>
